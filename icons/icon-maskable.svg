<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="maskBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a63"/>
      <stop offset="60%" stop-color="#0e1b2f"/>
      <stop offset="100%" stop-color="#070c14"/>
    </radialGradient>
    <linearGradient id="maskGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="30%" stop-color="#f5b041"/>
      <stop offset="100%" stop-color="#7d4e04"/>
    </linearGradient>
    <linearGradient id="maskRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#b32025"/>
    </linearGradient>
    <filter id="maskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full background for maskable (no rounded rect so OS can mask safely) -->
  <rect width="512" height="512" fill="url(#maskBg)"/>

  <!-- Centered Safe-Zone Content -->
  <g transform="translate(256, 230) scale(0.85) translate(-256, -230)">
    <!-- Ambient Shadow -->
    <ellipse cx="256" cy="350" rx="140" ry="25" fill="#000" opacity="0.5" filter="blur(14px)"/>

    <!-- Left Gold Die -->
    <g transform="translate(60, 45) rotate(-10, 175, 230)" filter="url(#maskShadow)">
      <polygon points="175,130 245,170 175,210 105,170" fill="#f5b041"/>
      <circle cx="175" cy="170" r="7" fill="#3d2602"/>
      <polygon points="105,170 175,210 175,295 105,255" fill="#c9820f"/>
      <circle cx="140" cy="232" r="7" fill="#fff"/>
      <circle cx="120" cy="200" r="7" fill="#fff"/>
      <circle cx="160" cy="264" r="7" fill="#fff"/>
      <polygon points="175,210 245,170 245,255 175,295" fill="#8c5806"/>
      <circle cx="210" cy="230" r="7" fill="#3d2602"/>
    </g>

    <!-- Right Red Die -->
    <g transform="translate(70, 30) rotate(12, 290, 220)" filter="url(#maskShadow)">
      <polygon points="290,110 365,155 290,200 215,155" fill="#ee5253"/>
      <circle cx="290" cy="155" r="8" fill="#fff"/>
      <circle cx="256" cy="135" r="8" fill="#fff"/>
      <circle cx="324" cy="175" r="8" fill="#fff"/>
      <polygon points="215,155 290,200 290,290 215,245" fill="#b32025"/>
      <circle cx="240" cy="190" r="8" fill="#fff"/>
      <circle cx="265" cy="205" r="8" fill="#fff"/>
      <circle cx="240" cy="245" r="8" fill="#fff"/>
      <circle cx="265" cy="260" r="8" fill="#fff"/>
      <polygon points="290,200 365,155 365,245 290,290" fill="#790d11"/>
      <circle cx="327" cy="222" r="14" fill="#fff"/>
    </g>

    <!-- Logo Title -->
    <rect x="96" y="390" width="320" height="46" rx="23" fill="rgba(11, 19, 31, 0.9)" stroke="url(#maskGold)" stroke-width="2.5"/>
    <text x="256" y="422" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="24" font-weight="900" fill="url(#maskGold)" text-anchor="middle" letter-spacing="3">
      DADOMANÍA
    </text>
  </g>
</svg>
